# GoReleaser config: builds the standalone binaries and the .deb/.rpm
# packages. Run locally with `goreleaser release --snapshot --clean`.
version: 2

project_name: worlds-tui

builds:
  - id: worlds-tui
    main: ./cmd/worlds-tui
    binary: worlds-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    # 32-bit ARM only for Linux (Raspberry Pi OS and similar).
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  # Bare executables, no archive around them.
  - id: binaries
    ids: [worlds-tui]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

nfpms:
  - id: packages
    ids: [worlds-tui]
    package_name: worlds-tui
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/BigBoyChnusti/worlds-tui
    maintainer: BigBoyChnusti <luca.cattin@chnusti.xyz>
    description: |-
      Terminal app for the League of Legends World Championship.
      Live game stats and the Play-In, Swiss and Knockout brackets.
    section: games
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/worlds-tui/README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^style(\(.+\))?:'

release:
  prerelease: auto
