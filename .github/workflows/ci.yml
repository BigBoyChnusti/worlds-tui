name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # Builds the binaries and packages exactly as a release would, without
  # publishing, and keeps them as workflow artifacts.
  snapshot:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - uses: actions/upload-artifact@v7
        with:
          name: worlds-tui-snapshot
          path: |
            dist/*.deb
            dist/*.rpm
            dist/worlds-tui_*/worlds-tui*
            dist/checksums.txt
          retention-days: 14

  # Installs the snapshot .deb on a native runner of each architecture and
  # starts the installed binary.
  smoke:
    needs: snapshot
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: worlds-tui-snapshot
          path: dist

      - name: Install the ${{ matrix.arch }} package
        run: sudo apt-get install -y ./dist/worlds-tui_*_${{ matrix.arch }}.deb

      - name: Run it
        run: |
          worlds-tui -version
          worlds-tui -snapshot -width 100 -height 30 > menu.txt
          grep -q "World Championship" menu.txt
